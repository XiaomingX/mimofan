[workspace]
members = [
    "crates/agent",
    "crates/app-server",
    "crates/config",
    "crates/core",
    "crates/execpolicy",
    "crates/hooks",
    "crates/localization",
    "crates/mcp",
    "crates/memory",
    "crates/protocol",
    "crates/release",
    "crates/secrets",
    "crates/state",
    "crates/tools",
    "crates/tui",
]
default-members = ["crates/app-server", "crates/tui"]
resolver = "2"

[workspace.package]
version = "0.0.9"
edition = "2024"
# Rust 1.88 stabilized `let_chains` in `if`/`while` conditions, which the
# codebase relies on extensively. Cargo enforces this so users on older
# toolchains get a clear "package requires rustc 1.88+" error instead of a
# confusing E0658 from rustc.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/XiaomingX/mimofan"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.5", features = ["json"] }
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
clap_complete = "4.5"
dirs = "6.0.0"
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls-no-provider", "socks"] }
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
semver = "1.0.28"
thiserror = "2.0"
tempfile = "3.27"
tokio = { version = "1.50.0", features = ["full"] }
toml = "1.0.6"
# 0.25 与 toml 1.x / proc-macro-crate 共享同一套 winnow 1.0 + toml_datetime 1.1，
# 避免 toml_edit/winnow/toml_datetime 各编译两个版本
toml_edit = "0.25"
sha2 = "0.10"
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.11", features = ["v4"] }

# ── Build profiles: reduce target/ disk usage & optimize performance ───
# Default debug builds emit full DWARF (~500 MB+ for a workspace this size).
# Switching to "line-tables-only" cuts that by 60-80 % while preserving
# backtraces and IDE breakpoint support.

[profile.dev]
# Only emit line tables, not full DWARF debug info. Saves massive disk space.
debug = "line-tables-only"
# Higher codegen-units = more parallelism = faster compile (at a small
# code-size/runtime cost, acceptable for dev). This produces MORE .o files,
# not fewer — the previous comment was backwards.
codegen-units = 16
# macOS build optimization: use unpacked debuginfo to speed up links significantly
split-debuginfo = "unpacked"
# IMPORTANT: disable incremental compilation so `sccache` (configured in
# ~/.cargo/config.toml) can cache dependency builds. sccache refuses to cache
# any rustc invocation made with `-C incremental`, so leaving this on meant
# the 20 GB incremental/ cache grew unbounded AND no dependency was ever cached
# across builds/projects. With this off, large third-party crates compile once
# and are reused everywhere via sccache.
incremental = false

[profile.dev.package."*"]
# Optimize dependencies in dev mode for faster runtime performance
opt-level = 3

[profile.test]
# Tests don't need full debug info either
debug = "line-tables-only"
codegen-units = 16
# macOS build optimization: use unpacked debuginfo to speed up links significantly
split-debuginfo = "unpacked"
# Same rationale as [profile.dev]: let sccache cache test builds.
incremental = false

[profile.test.package."*"]
# Optimize dependencies in test mode for faster runtime performance
opt-level = 3

[profile.release]
# Strip all symbols from release binaries — huge savings
strip = true
# Thin LTO: provides nearly the same runtime performance as Fat LTO but compiles much faster
lto = "thin"
# Enable parallel code generation for faster release compilation without sacrificing thin LTO benefits
codegen-units = 16
# Fast macOS compilation: avoid slow dsymutil debuginfo aggregation during linking
split-debuginfo = "unpacked"

[profile.bench]
strip = true
lto = "thin"
codegen-units = 16
