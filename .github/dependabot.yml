version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Root JS workspace is managed with bun (bun.lock). Dependabot monitors
  # package.json version ranges; verify bun.lock support on the platform
  # before relying on lockfile update PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
