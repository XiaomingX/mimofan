name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package/release version to publish to npm, without the leading v'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  parity:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Pin an explicit toolchain so `cargo fmt` / `clippy` / `check` are
      # byte-for-byte reproducible between local verification and CI. Tracking
      # `stable` (or `@master`) let a newer rustfmt silently re-wrap files the
      # local formatter left untouched, which made the Format gate flake.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Compile check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        # Enforce only the genuinely safety-critical lint (`unsafe_code`) so the
        # release pipeline stays green while still blocking unsound code. The
        # previous `clippy -- -D warnings` promoted EVERY `clippy::all` cosmetic
        # lint (collapsible_if, field init order, type-alias suggestions, …) to
        # a hard error, which blocked every release on pre-existing stylistic
        # debt while catching no real bug.
        #
        # The job-level `RUSTFLAGS: -Dwarnings` would otherwise leak into this
        # step and turn every `clippy::all` warning into an error — so we clear
        # it here and instead allow `clippy::all` explicitly. `unsafe_code` is a
        # rustc lint (not part of `clippy::all`) and stays denied via
        # `[workspace.lints.rust]`, so unsound `unsafe` code is still blocked.
        env:
          RUSTFLAGS: ""
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- \
            -A clippy::all \
            -A clippy::uninlined_format_args \
            -A clippy::too_many_arguments \
            -A clippy::unnecessary_map_or \
            -A clippy::assertions_on_constants
      - name: Workspace tests
        run: cargo test --workspace --all-features --locked
      - name: Lockfile drift guard
        run: git diff --exit-code -- Cargo.lock

  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      source_ref: ${{ steps.release.outputs.source_ref }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve release source
        id: release
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="v${{ inputs.version }}"
            if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
              sha="$(git rev-list -n 1 "${tag}")"
              source_ref="${tag}"
            else
              # Tag doesn't exist yet — build from HEAD
              sha="${GITHUB_SHA}"
              source_ref="${GITHUB_SHA}"
              echo "Tag ${tag} not found; building from ${source_ref} @ ${sha}"
            fi
          else
            tag="${GITHUB_REF_NAME}"
            sha="${GITHUB_SHA}"
            source_ref="${GITHUB_REF_NAME}"
          fi

          if [ -z "${sha}" ]; then
            echo "Unable to resolve release source for ${tag}" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "source_ref=${source_ref}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
      - name: Require release source on main
        run: ./scripts/release/ensure-release-on-main.sh "${{ steps.release.outputs.sha }}"

  build:
    needs: [parity, resolve]
    # `parity` is gated to tag-push events. On manual `workflow_dispatch`,
    # parity is skipped, so let `build` proceed when resolve succeeded and
    # parity either succeeded or was skipped — but never when parity actually
    # failed or the run was cancelled. Operators using dispatch are expected
    # to have already run the same gates locally / via ci.yml on `main`.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.parity.result == 'success' || needs.parity.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- mimofan (cli dispatcher, canonical) ---
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: mimofan
            artifact_name: mimofan-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: mimofan
            artifact_name: mimofan-macos-arm64
          # Linux 走 musl 静态链接：GNU 构建会把产物钉死在 runner 的 glibc
          # 版本上（Ubuntu 24.04 = glibc 2.39），比它旧的发行版直接跑不起来，
          # 这正是 update.rs 里 glibc preflight 要拦的情况。静态 musl 产物
          # 无此约束，preflight 因为找不到 GLIBC_ 符号也会自动放行。
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: mimofan
            artifact_name: mimofan-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: mimofan
            artifact_name: mimofan-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mimofan.exe
            artifact_name: mimofan-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}
      # Pinned to match the `parity` job (see comment there) — keeps the
      # release binaries built with the same toolchain we verified locally.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      # rusqlite 用的是 `bundled` feature（从 C 源码编译 SQLite），ring 也带
      # C/汇编，因此 musl target 需要一套 musl C 工具链，否则 cc 会拿 glibc
      # 的 gcc 去编而链接失败。
      - name: Install musl toolchain
        if: ${{ contains(matrix.target, '-musl') }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev
      - name: Build
        shell: bash
        env:
          DEEPSEEK_BUILD_SHA: ${{ needs.resolve.outputs.sha }}
          # 让 cc crate 在交叉/静态场景下用 musl-gcc 而非默认 cc。
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          for attempt in 1 2 3; do
            if cargo build --release --locked --target ${{ matrix.target }}; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Build attempt ${attempt} failed; retrying in 30s..."
              sleep 30
            fi
          done
          echo "Build failed after 3 attempts" >&2
          exit 1
      - name: Rename binary
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if [ ! -f "${BIN_PATH}" ]; then
            echo "Binary not at ${BIN_PATH}; searching target/ for ${{ matrix.binary }}:"
            find target -name "${{ matrix.binary }}" -type f
            exit 1
          fi
          cp "${BIN_PATH}" "${{ matrix.artifact_name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  bundle:
    needs: [build, resolve]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: 'mimofan*'
      - name: Create platform archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundles/checksums
          MANIFEST="bundles/checksums/mimofan-bundles-sha256.txt"
          : > "$MANIFEST"

          bundle() {
            local platform="$1"   # macos-x64, macos-arm64, linux-x64, ...
            local src="$2"        # artifact name for mimofan binary
            local ext="$3"        # tar.gz | zip

            local dir="bundles/mimofan-${platform}"
            mkdir -p "$dir"

            # Copy binary. Windows 资产自带 .exe 后缀，解包后也应保留，
            # 否则用户拿到的文件在 Windows 上不可执行。
            if [ "${ext}" = "zip" ]; then
              cp "artifacts/${src}/${src}" "$dir/mimofan.exe"
            else
              cp "artifacts/${src}/${src}" "$dir/mimofan"
              # Add install script（仅 tar.gz 的类 Unix 包需要）
              cp scripts/release/install.sh "$dir/"
              chmod +x "$dir/install.sh"
            fi

            local archive="mimofan-${platform}.${ext}"
            if [ "${ext}" = "zip" ]; then
              (cd bundles && zip -qr "mimofan-${platform}.zip" "mimofan-${platform}/")
            else
              tar -czf "bundles/${archive}" -C bundles "mimofan-${platform}/"
            fi

            sha256sum "bundles/${archive}" | awk '{printf "%s  %s\n", $1, $2}' >> "$MANIFEST"
            echo "  Created bundles/${archive}"
          }

          # Platform: macos-x64
          bundle macos-x64 \
            mimofan-macos-x64 tar.gz

          # Platform: macos-arm64
          bundle macos-arm64 \
            mimofan-macos-arm64 tar.gz

          # Platform: linux-x64 (musl static)
          bundle linux-x64 \
            mimofan-linux-x64 tar.gz

          # Platform: linux-arm64 (musl static)
          bundle linux-arm64 \
            mimofan-linux-arm64 tar.gz

          # Platform: windows-x64
          bundle windows-x64 \
            mimofan-windows-x64.exe zip

          echo ""
          echo "=== Archive checksums ==="
          cat "$MANIFEST"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mimofan-bundles
          path: bundles/*
          if-no-files-found: error

  release:
    needs: [build, bundle, resolve]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.bundle.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checked out into a subdirectory so it cannot clobber the downloaded
      # artifacts; used for the release-body generator and the CHANGELOG.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          path: repo
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: '*'
      - name: List artifacts
        run: find artifacts -type f
      - name: Generate checksum manifest
        shell: bash
        run: |
          mkdir -p artifacts/checksums
          # Canonical manifest used by mimofan's `mimofan update` flow.
          manifest="artifacts/checksums/mimofan-artifacts-sha256.txt"
          : > "${manifest}"
          while IFS= read -r -d '' file; do
            hash="$(sha256sum "${file}" | awk '{print $1}')"
            base="$(basename "${file}")"
            printf '%s  %s\n' "${hash}" "${base}" >> "${manifest}"
          done < <(find artifacts -type f ! -path 'artifacts/checksums/*' -print0 | sort -z)
          cat "${manifest}"
      - name: Generate release body from CHANGELOG
        shell: bash
        run: |
          ./repo/scripts/release/generate-release-body.sh \
            "${{ needs.resolve.outputs.tag }}" repo/CHANGELOG.md > release-body.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: artifacts/*/*
          prerelease: false
          body_path: release-body.md

  homebrew:
    needs: [release, resolve]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check Homebrew tap token
        id: homebrew-token
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_PAT || secrets.RELEASE_TAG_PAT }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "No Homebrew tap token configured; skipping tap update."
            echo "available=false" >> "${GITHUB_OUTPUT}"
          else
            echo "available=true" >> "${GITHUB_OUTPUT}"
          fi
      # Checkout main (not the tag) so the release-infra script is always
      # available, even for tags created before this workflow was added.
      - uses: actions/checkout@v7
        if: steps.homebrew-token.outputs.available == 'true'
        with:
          ref: main
      - name: Download checksum manifest
        if: steps.homebrew-token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ needs.resolve.outputs.tag }} \
            --repo ${{ github.repository }} \
            --pattern 'mimofan-artifacts-sha256.txt' \
            --dir /tmp
      - name: Update Homebrew tap
        if: steps.homebrew-token.outputs.available == 'true'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          MANIFEST: /tmp/mimofan-artifacts-sha256.txt
          TAP_REPO: Hmbown/homebrew-mimofan
          TOKEN: ${{ secrets.HOMEBREW_TAP_PAT || secrets.RELEASE_TAG_PAT }}
        run: bash .github/scripts/update-homebrew-tap.sh

# npm publish is intentionally not automated. The npm account requires 2FA OTP
# on every publish, and a granular automation token that bypasses 2FA has not
# been provisioned. Release the npm wrapper manually from a developer machine
# after the GitHub Release has been created — see CLAUDE.md "Releases" for the
# exact commands.
