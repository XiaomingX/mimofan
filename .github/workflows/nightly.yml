name: Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  DEEPSEEK_BUILD_SHA: ${{ github.sha }}

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- mimofan (cli dispatcher, canonical) ---
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: mimofan
            artifact_name: mimofan-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: mimofan
            artifact_name: mimofan-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}
      - name: Install Rust target
        run: rustup target add --toolchain nightly ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Build
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cargo build --release --locked --target ${{ matrix.target }}; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Build attempt ${attempt} failed; retrying in 30s..."
              sleep 30
            fi
          done
          echo "Build failed after 3 attempts" >&2
          exit 1
      - name: Stage artifact
        id: stage
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          bin_path="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if [ ! -f "${bin_path}" ]; then
            echo "Binary not at ${bin_path}; searching target/ for ${{ matrix.binary }}:"
            find target -name "${{ matrix.binary }}" -type f
            exit 1
          fi

          mkdir -p nightly
          cp "${bin_path}" "nightly/${{ matrix.artifact_name }}"
          cat > nightly/nightly-build-info.txt <<INFO
          repository=${GITHUB_REPOSITORY}
          ref=${GITHUB_REF_NAME}
          commit=${GITHUB_SHA}
          artifact=${{ matrix.artifact_name }}
          INFO
          echo "name=${{ matrix.artifact_name }}-${short_sha}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stage.outputs.name }}
          path: nightly/*
          retention-days: 14
