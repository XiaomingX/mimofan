[build]
# Avoid duplicating debug symbol sections across incremental builds
rustflags = ["-C", "split-debuginfo=unpacked"]

[profile.dev]
# Reduce debuginfo level to 1 (line tables only) to drastically shrink target size (50%-70% reduction)
debug = 1
# Incremental builds can accumulate large old artifacts over time
incremental = true

[profile.release]
debug = false
lto = "thin"
codegen-units = 1
