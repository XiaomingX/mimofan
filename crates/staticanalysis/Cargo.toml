[package]
name = "mimofan-staticanalysis"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tree-sitter = "0.25"
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-kotlin-ng = { version = "1.1", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
tree-sitter-objc = { version = "3", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
rusqlite = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = "1"

[features]
# Default build compiles the Rust + Java grammars. Java is on by default
# because the auto-gadget discovery engine (W2 / #788) and the cross-file Java
# call graph require it; tree-sitter-java is already a declared dependency.
default = ["lang-rust", "lang-java"]
lang-rust = ["dep:tree-sitter-rust"]
lang-java = ["dep:tree-sitter-java"]
lang-typescript = ["dep:tree-sitter-typescript"]
lang-javascript = ["dep:tree-sitter-javascript"]
lang-kotlin = ["dep:tree-sitter-kotlin-ng"]
lang-swift = ["dep:tree-sitter-swift"]
lang-objc = ["dep:tree-sitter-objc"]
lang-json = ["dep:tree-sitter-json"]
# Convenience meta-feature: all grammars (longer build, full coverage).
lang-all = [
    "lang-rust",
    "lang-java",
    "lang-typescript",
    "lang-javascript",
    "lang-kotlin",
    "lang-swift",
    "lang-objc",
    "lang-json",
]
# Persistent symbol index (SQLite). Off by default so the default build does
# not pull in the bundled SQLite compile. Enable for the SAST code-index.
symbol-index = ["dep:rusqlite"]

[dev-dependencies]
# Test-only: tempdir fixtures for call-graph / auto-gadget integration tests.
tempfile = { workspace = true }
