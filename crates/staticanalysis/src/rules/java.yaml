# Java security rules — declarative, hot-reloadable.
# Symbols are matched by their BARE method/type name (last segment); the
# java_taint frontend seeds tainted argument positions and the taint solver
# matches source/sink/sanitizer/propagator calls. Bare names keep matching
# independent of receiver packages (javax/spring/shiro alike).
# `neutralizes: []` = strong (full) sanitizer; `neutralizes: [xss]` = partial.

