[package]
name = "mimofan-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Secret storage backends (OS keyring with file fallback) for DeepSeek workspace"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }

# keyring 4.x：平台后端（macOS 用 apple-native-keyring-store / security-framework 3.x）
# 由 keyring 自身的 target 依赖自动选择，不再需要显式 feature。
[target.'cfg(target_os = "macos")'.dependencies]
keyring = "4"

[dev-dependencies]
tempfile.workspace = true
