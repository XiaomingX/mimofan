[package]
name = "mimofan"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MiMo 专属中文编码助手 TUI"
default-run = "mimofan"

[features]
default = ["tui", "json", "toml", "vector-memory"]
tui = ["dep:schemaui", "schemaui/tui", "json", "toml"]
web = ["dep:schemaui", "schemaui/web", "json", "toml"]
json = ["schemaui/json"]
toml = ["schemaui/toml"]
long-running-tests = []
# 向量记忆（互补于 crate::memory 文件记忆）。默认开启：编译进默认二进制，但运行
# 时若未配置 MIMOFAN_MEMORY_API_KEY 则优雅降级为"禁用"状态（inner=None，零 I/O、
# 零报错），对未配置用户完全无副作用；配置后自动获得跨会话语义召回能力。
# 注意：`mimofan-memory` crate 已提升为始终链接（见 [dependencies]），因为共享的
# `MemoryCategory` 分类需要被始终编译的模块（crate::memory / turn_memory）无条件
# 引用。本 feature 现在仅作为向量记忆运行时代码的编译开关。
vector-memory = []

[[bin]]
name = "mimofan"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
mimofan-agent = { path = "../agent" }
mimofan-app-server = { path = "../app-server" }
mimofan-config = { path = "../config" }
mimofan-core = { path = "../core" }
mimofan-execpolicy = { path = "../execpolicy" }
mimofan-hooks = { path = "../hooks" }
mimofan-localization = { path = "../localization" }
mimofan-mcp = { path = "../mcp" }
mimofan-protocol = { path = "../protocol" }
mimofan-release = { path = "../release" }
mimofan-secrets = { path = "../secrets" }
mimofan-state = { path = "../state" }
mimofan-tools = { path = "../tools" }
mimofan-staticanalysis = { path = "../staticanalysis" }
# 始终链接：共享的 `MemoryCategory` 分类需要被始终编译的模块无条件引用，
# 故不再 optional（原 `vector-memory` feature 现在只 gate 向量记忆运行时代码）。
mimofan-memory = { path = "../memory" }
# 始终链接：省 token / 性能指标的本地 Prometheus 风格埋点（无外部依赖，
# `otlp` feature 才拉 OpenTelemetry 栈）。用于 #20 prefix cache 命中指标上报。
mimofan-telemetry = { path = "../telemetry" }
schemaui = { version = "0.12.0", default-features = false, optional = true }
async-stream = "0.3.6"
async-trait.workspace = true
base64 = "0.22.1"
axum = { workspace = true, features = ["json"] }
clap = { workspace = true, features = ["derive"] }
clap_complete.workspace = true
colored = "3.0.0"
crossterm = "0.29"
dotenvy = "0.15.7"
dirs.workspace = true
fd-lock = "4.0.4"
futures-util = "0.3.31"
# default-features=false: 代码仅使用 TokenResponse trait，无需 oauth2 内置的
# reqwest 0.12 HTTP 客户端（避免与 workspace 的 reqwest 0.13 重复编译两套 HTTP 栈）
oauth2 = { version = "5", default-features = false }
ratatui = "0.30"
regex = "1.11"
reqwest = { workspace = true, default-features = false, features = ["blocking", "json", "stream", "multipart", "form", "rustls-no-provider", "http2", "gzip", "brotli"] }
# rmcp >= 2.2 使用 reqwest ^0.13（与 workspace 一致），auth feature 的 oauth2
# 为 default-features=false，不再拖入 reqwest 0.12 —— 消除双 HTTP 栈重复编译
rmcp = { version = "2.2.0", default-features = false, features = ["auth", "client"] }
rustls.workspace = true
qrcode = { version = "0.14", default-features = false }
similar = "3"
# 差分渲染语法高亮：仅启用内置语法/主题，避免拖入 onig（正则引擎）与 assets 下载
# 差分渲染语法高亮：纯 Rust 正则引擎（regex-fancy），避免拖入 onig C 依赖
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
semver.workspace = true
schemars = { version = "1.2.1", features = ["derive", "preserve_order"] }
shellexpand = "3"
tiktoken-rs.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { version = "0.7.16", features = ["io"] }
unicode-width = "0.2"
unicode-segmentation = "1.12"
urlencoding = "2.1"
uuid = { workspace = true, features = ["v4"] }
chrono.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
wait-timeout = "0.2"
webbrowser = "1.0"
multimap = "0.10.0"
# 2.x 与 cc 构建依赖使用的 shlex 收口为同一版本，避免重复编译
shlex = "2"
tiny_http = "0.12"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
lru = "0.18"
parking_lot = "0.12"
pdf-extract = "0.12"
tar = "0.4"
flate2 = "1.1"
sha2.workspace = true

[dev-dependencies]
cucumber = "0.23.0"
wiremock = "0.6"
pretty_assertions = "1.4"
vt100 = "0.16"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "windows", all(target_os = "linux", not(target_env = "ohos"))))'.dependencies]
arboard = "3.4"

[target.'cfg(not(target_env = "ohos"))'.dependencies]
portable-pty = "0.9"
starlark = "0.14.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL"] }
